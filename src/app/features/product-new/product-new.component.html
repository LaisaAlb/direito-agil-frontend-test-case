<app-header></app-header>

<div class="page">
  <h2>Novo Produto
    <lucide-icon name="plus" class="icon"></lucide-icon>
  </h2>

  <form [formGroup]="form" (ngSubmit)="save()">

    <label>Nome</label>
    <input type="text" formControlName="name" />
    <small *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="error">Campo obrigatório</small>

    <label>Categoria</label>
    <input type="text" formControlName="category" />
    <small *ngIf="form.get('category')?.invalid && form.get('category')?.touched" class="error">Campo obrigatório</small>

    <label>Preço</label>
    <input type="number" formControlName="price" step="0.01" />
    <small *ngIf="form.get('price')?.invalid && form.get('price')?.touched" class="error">Valor inválido</small>

    <label>Estoque</label>
    <input type="number" formControlName="stock" />
    <small *ngIf="form.get('stock')?.invalid && form.get('stock')?.touched" class="error">Valor inválido</small>

    <label>Descrição</label>
    <textarea formControlName="description"></textarea>
    <small *ngIf="form.get('description')?.invalid && form.get('description')?.touched" class="error">Campo obrigatório</small>

    <div class="actions">
      <button type="submit" [disabled]="form.invalid || isSaving" class="btn-save">
        <lucide-icon name="save" class="icon"></lucide-icon>
        Salvar
      </button>

      <button type="button" (click)="cancel()" class="btn-cancel">
        <lucide-icon name="x" class="icon"></lucide-icon>
        Voltar
      </button>
    </div>

    <p *ngIf="isSaving">Salvando...</p>
  </form>
</div>

<app-confirmation-modal
  *ngIf="showSuccessModal"
  title="Sucesso!"
  message="Produto criado com sucesso!"
  [showConfirmButtons]="false"
  (cancel)="closeSuccessModal()">
</app-confirmation-modal>
